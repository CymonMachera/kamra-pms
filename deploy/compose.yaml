# Citizen Lodge - Kamra PMS production stack (Machera Group).
# Deployed by CI to /opt/citizen-lodge-kamra/. All credentials come from the
# .env written at deploy time from GitHub Secrets - never committed.
x-app: &app
  image: ghcr.io/cymonmachera/kamra-lodge:latest
  restart: unless-stopped
  volumes:
    - sites:/home/frappe/frappe-bench/sites
  depends_on:
    - db
    - redis-cache
    - redis-queue

services:
  db:
    image: mariadb:10.6
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set in .env}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: mysqladmin ping -h localhost --password=${DB_ROOT_PASSWORD}
      interval: 5s
      retries: 15

  redis-cache:
    image: redis:6.2-alpine
    restart: unless-stopped

  redis-queue:
    image: redis:6.2-alpine
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

  configurator:
    <<: *app
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - >
        bench set-config -g db_host db;
        bench set-config -gp db_port 3306;
        bench set-config -g redis_cache "redis://redis-cache:6379";
        bench set-config -g redis_queue "redis://redis-queue:6379";
        bench set-config -g redis_socketio "redis://redis-queue:6379";
        bench set-config -gp socketio_port 9000;

  backend:
    <<: *app

  frontend:
    <<: *app
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${KAMRA_SITE:?set in .env}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    ports:
      - "127.0.0.1:8083:8080"   # host nginx proxies citizen.machera.co.tz here

  websocket:
    <<: *app
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]

  queue-short:
    <<: *app
    command: ["bench", "worker", "--queue", "short,default"]

  queue-long:
    <<: *app
    command: ["bench", "worker", "--queue", "long,default,short"]

  scheduler:
    <<: *app
    command: ["bench", "schedule"]

volumes:
  sites:
  db-data:
  redis-queue-data:
