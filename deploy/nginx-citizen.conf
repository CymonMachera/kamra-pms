# citizen.machera.co.tz -> Kamra PMS (Frappe frontend on 127.0.0.1:8083)
# TLS certificate is managed by certbot and already present for this domain.
server {
    listen 80;
    server_name citizen.machera.co.tz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name citizen.machera.co.tz;

    ssl_certificate     /etc/letsencrypt/live/citizen.machera.co.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/citizen.machera.co.tz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
