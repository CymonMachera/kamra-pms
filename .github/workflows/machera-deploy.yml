# Machera Group deployment for Citizen Lodge.
# Lives on the `machera` branch of this fork. Contains NO credentials -
# every secret is read from GitHub Secrets at run time.
name: Deploy Citizen Lodge (Kamra)

on:
  push:
    branches: [machera]
  workflow_dispatch:
    inputs:
      install_vhost:
        description: "(Re)install the citizen.machera.co.tz nginx vhost pointing at Kamra"
        type: boolean
        default: false
      reset_site:
        description: "DANGER: drop and recreate the site (destroys lodge data)"
        type: boolean
        default: false
      tune_server:
        description: "Add swap and report memory headroom (safe, idempotent)"
        type: boolean
        default: false
      seed_lodge:
        description: "Apply the property/room seed held in LODGE_SEED_B64 (idempotent)"
        type: boolean
        default: false

# One deploy at a time - concurrent runs fight over container names on the server
concurrency:
  group: citizen-lodge-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/cymonmachera/kamra-lodge

jobs:
  build:
    if: ${{ !inputs.tune_server && !inputs.seed_lodge }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout frappe_docker (build tooling)
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: frappe_docker

      - name: Compose apps.json
        run: |
          cat > apps.json <<'EOF'
          [
            { "url": "https://github.com/frappe/payments", "branch": "version-16" },
            { "url": "https://github.com/CymonMachera/kamra-pms", "branch": "machera" }
          ]
          EOF

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: frappe_docker
          file: frappe_docker/images/custom/Containerfile
          push: true
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-16
            CACHE_BUST=${{ github.sha }}
          secret-files: |
            apps_json=./apps.json
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build
    if: ${{ !inputs.tune_server && !inputs.seed_lodge }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ship compose + nginx config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: deploy/compose.yaml,deploy/nginx-citizen.conf
          target: /opt/citizen-lodge-kamra/
          strip_components: 1

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 40m
          script: |
            set -e
            SITE="${{ secrets.KAMRA_SITE }}"

            mkdir -p /root/backups
            mkdir -p /opt/citizen-lodge-kamra && cd /opt/citizen-lodge-kamra
            mv -f compose.yaml docker-compose.yml 2>/dev/null || true
            cat > .env <<EOF
            KAMRA_SITE=$SITE
            DB_ROOT_PASSWORD=${{ secrets.KAMRA_DB_ROOT_PASSWORD }}
            EOF
            chmod 600 .env

            # Safety net: back up the live Kamra site (DB + files) with the
            # CURRENT image, before new code can touch it. Fails the deploy if
            # the backup fails. Copies land in /root/backups/kamra (last 30 kept).
            # The DB is dumped from the db container itself: bench backup uses the
            # image's newer mariadb-dump, which insists on TLS that mariadb:10.6
            # here does not offer.
            if [ -n "$(docker compose ps -q db 2>/dev/null)" ] && \
               [ -n "$(docker compose ps -q backend 2>/dev/null)" ]; then
              # a container started before a Docker/runc upgrade can refuse exec
              # ("SetSSB requires libseccomp"); a restart fixes it. If exec still
              # fails, set -e stops the deploy - never skip the backup silently.
              for SVC in db backend; do
                docker compose exec -T $SVC true 2>/dev/null || docker compose restart $SVC
                docker compose exec -T $SVC true
              done
              sleep 5
              STAMP=$(date +%F-%H%M)
              B=/root/backups/kamra
              mkdir -p $B
              docker compose exec -T db sh -c \
                'mysqldump -uroot -p"$MYSQL_ROOT_PASSWORD" --single-transaction --routines --events --all-databases' \
                | gzip > $B/kamra-db-$STAMP.sql.gz
              # gzip hides a failed dump - check it really holds tables
              zcat $B/kamra-db-$STAMP.sql.gz | grep -q "CREATE TABLE" \
                || { echo "Kamra DB backup is empty - aborting deploy"; exit 1; }
              docker compose exec -T backend sh -c \
                "cd sites/$SITE && tar czf - \$(ls -d public/files private/files 2>/dev/null)" \
                > $B/kamra-files-$STAMP.tar.gz
              ls -1t $B/* | tail -n +21 | xargs -r rm -f
              echo "Kamra backup: $(ls -lh $B/kamra-*-$STAMP.* | awk '{print $5, $9}' | tr '\n' ' ')"
            fi

            echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io -u cymonmachera --password-stdin
            docker compose pull
            docker compose up -d
            sleep 15

            if [ "${{ inputs.reset_site }}" = "true" ]; then
              docker compose exec -T backend bench drop-site "$SITE" \
                --db-root-password "${{ secrets.KAMRA_DB_ROOT_PASSWORD }}" --force --no-backup || true
            fi

            # sites volume may carry an apps.txt from an older image
            docker compose exec -T backend bash -c 'ls -1 apps > sites/apps.txt'

            if ! docker compose exec -T backend test -d "sites/$SITE"; then
              echo "First boot: creating $SITE"
              docker compose exec -T backend bench new-site "$SITE" \
                --mariadb-root-password "${{ secrets.KAMRA_DB_ROOT_PASSWORD }}" \
                --admin-password "${{ secrets.KAMRA_ADMIN_PASSWORD }}" \
                --install-app payments --install-app kamra \
                --set-default --mariadb-user-host-login-scope='%'
            fi

            for APP in payments kamra; do
              docker compose exec -T backend bash -c \
                "bench --site '$SITE' list-apps | grep -q $APP || bench --site '$SITE' install-app $APP"
            done
            # No "|| true": a failed migration must fail the deploy (the backup above is the way back)
            docker compose exec -T backend bench --site all migrate
            docker compose exec -T backend bench --site "$SITE" set-config host_name "https://$SITE" || true

            # Point the public domain at Kamra (needed only on a fresh server)
            if [ "${{ inputs.install_vhost }}" = "true" ]; then
              # verify Kamra answers locally before handing it the domain
              code=$(curl -s -o /dev/null -w '%{http_code}' -H "Host: $SITE" http://127.0.0.1:8083/login || echo 000)
              if [ "$code" != "200" ]; then
                echo "Kamra not healthy (HTTP $code) - vhost left unchanged"
                exit 1
              fi
              cp -f /etc/nginx/sites-available/citizen.conf /root/backups/nginx-citizen.conf.bak 2>/dev/null || true
              cp nginx-citizen.conf /etc/nginx/sites-available/citizen.conf
              ln -sf /etc/nginx/sites-available/citizen.conf /etc/nginx/sites-enabled/citizen.conf
              nginx -t && systemctl reload nginx
              echo "citizen.machera.co.tz -> Kamra (127.0.0.1:8083)"
            fi

            docker image prune -f

  tune-server:
    if: ${{ inputs.tune_server }}
    runs-on: ubuntu-latest
    steps:
      - name: Add swap and report headroom
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            if ! swapon --show | grep -q /swapfile; then
              fallocate -l 8G /swapfile
              chmod 600 /swapfile
              mkswap /swapfile >/dev/null
              swapon /swapfile
              grep -q '^/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
              echo "8G swap created and persisted"
            else
              echo "swap already present"
            fi
            sysctl -w vm.swappiness=10 >/dev/null
            grep -q '^vm.swappiness' /etc/sysctl.conf || echo 'vm.swappiness=10' >> /etc/sysctl.conf
            echo "=== memory ==="
            free -h
            echo "=== disk ==="
            df -h / | awk 'NR==2{print $4" free of "$2}'
            echo "=== heaviest containers ==="
            docker stats --no-stream --format '{{.Name}}\t{{.MemUsage}}' | sort -k2 -h -r | head -8

  seed-lodge:
    if: ${{ inputs.seed_lodge }}
    runs-on: ubuntu-latest
    steps:
      - name: Apply lodge seed from secret
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: SEED_B64
          command_timeout: 15m
          script: |
            set -e
            cd /opt/citizen-lodge-kamra
            SITE="${{ secrets.KAMRA_SITE }}"
            # decode into the container, run once, delete - nothing persists on disk
            echo "${{ secrets.LODGE_SEED_B64 }}" | base64 -d > /tmp/seed_lodge.py
            docker compose cp /tmp/seed_lodge.py backend:/tmp/seed_lodge.py
            rm -f /tmp/seed_lodge.py
            docker compose exec -T backend bash -c               "cp /tmp/seed_lodge.py apps/kamra/kamra/scripts/_seed_lodge.py &&                bench --site '$SITE' execute kamra.scripts._seed_lodge.execute;                rm -f apps/kamra/kamra/scripts/_seed_lodge.py || true"
            docker compose exec -T --user root backend rm -f /tmp/seed_lodge.py || true
