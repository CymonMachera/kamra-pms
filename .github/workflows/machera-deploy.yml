# Machera Group deployment for Citizen Lodge.
# Lives on the `machera` branch of this fork. Contains NO credentials -
# every secret is read from GitHub Secrets at run time.
name: Deploy Citizen Lodge (Kamra)

on:
  push:
    branches: [machera]
  workflow_dispatch:
    inputs:
      cutover:
        description: "Point citizen.machera.co.tz at Kamra and stop QloApps"
        type: boolean
        default: false
      reset_site:
        description: "DANGER: drop and recreate the site (destroys lodge data)"
        type: boolean
        default: false
      purge_qloapps:
        description: "Remove the retired QloApps stack (archives its DB first)"
        type: boolean
        default: false
      tune_server:
        description: "Add swap and report memory headroom (safe, idempotent)"
        type: boolean
        default: false

# One deploy at a time - concurrent runs fight over container names on the server
concurrency:
  group: citizen-lodge-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/cymonmachera/kamra-lodge

jobs:
  build:
    if: ${{ !inputs.purge_qloapps && !inputs.tune_server }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout frappe_docker (build tooling)
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: frappe_docker

      - name: Compose apps.json
        run: |
          cat > apps.json <<'EOF'
          [
            { "url": "https://github.com/frappe/payments", "branch": "version-16" },
            { "url": "https://github.com/CymonMachera/kamra-pms", "branch": "machera" }
          ]
          EOF

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: frappe_docker
          file: frappe_docker/images/custom/Containerfile
          push: true
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-16
            CACHE_BUST=${{ github.sha }}
          secret-files: |
            apps_json=./apps.json
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build
    if: ${{ !inputs.purge_qloapps && !inputs.tune_server }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ship compose + nginx config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: deploy/compose.yaml,deploy/nginx-citizen.conf
          target: /opt/citizen-lodge-kamra/
          strip_components: 1

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 40m
          script: |
            set -e
            SITE="${{ secrets.KAMRA_SITE }}"

            # One-time safety net: keep a dated dump of the outgoing QloApps data
            mkdir -p /root/backups
            if docker ps --format '{{.Names}}' | grep -q '^citizen-lodge$'; then
              STAMP=$(date +%F)
              if [ ! -f "/root/backups/qloapps-final-$STAMP.sql.gz" ]; then
                docker exec citizen-lodge mysqldump -uroot citizenlodge 2>/dev/null \
                  | gzip > "/root/backups/qloapps-final-$STAMP.sql.gz" || true
                echo "QloApps backup: $(ls -lh /root/backups/qloapps-final-$STAMP.sql.gz | awk '{print $5}')"
              fi
            fi

            mkdir -p /opt/citizen-lodge-kamra && cd /opt/citizen-lodge-kamra
            mv -f compose.yaml docker-compose.yml 2>/dev/null || true
            cat > .env <<EOF
            KAMRA_SITE=$SITE
            DB_ROOT_PASSWORD=${{ secrets.KAMRA_DB_ROOT_PASSWORD }}
            EOF
            chmod 600 .env

            echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io -u cymonmachera --password-stdin
            docker compose pull
            docker compose up -d
            sleep 15

            if [ "${{ inputs.reset_site }}" = "true" ]; then
              docker compose exec -T backend bench drop-site "$SITE" \
                --db-root-password "${{ secrets.KAMRA_DB_ROOT_PASSWORD }}" --force --no-backup || true
            fi

            # sites volume may carry an apps.txt from an older image
            docker compose exec -T backend bash -c 'ls -1 apps > sites/apps.txt'

            if ! docker compose exec -T backend test -d "sites/$SITE"; then
              echo "First boot: creating $SITE"
              docker compose exec -T backend bench new-site "$SITE" \
                --mariadb-root-password "${{ secrets.KAMRA_DB_ROOT_PASSWORD }}" \
                --admin-password "${{ secrets.KAMRA_ADMIN_PASSWORD }}" \
                --install-app payments --install-app kamra \
                --set-default --mariadb-user-host-login-scope='%'
            fi

            for APP in payments kamra; do
              docker compose exec -T backend bash -c \
                "bench --site '$SITE' list-apps | grep -q $APP || bench --site '$SITE' install-app $APP"
            done
            docker compose exec -T backend bench --site all migrate || true
            docker compose exec -T backend bench --site "$SITE" set-config host_name "https://$SITE" || true

            # Cutover: hand the public domain from QloApps to Kamra
            if [ "${{ inputs.cutover }}" = "true" ]; then
              echo "=== CUTOVER ==="
              # verify Kamra answers locally before handing it the domain
              code=$(curl -s -o /dev/null -w '%{http_code}' -H "Host: $SITE" http://127.0.0.1:8083/login || echo 000)
              if [ "$code" != "200" ]; then
                echo "Kamra not healthy (HTTP $code) - aborting cutover, QloApps untouched"
                exit 1
              fi
              # keep the previous vhost so rollback is one copy away
              cp -n /etc/nginx/sites-available/citizen.conf \
                    /root/backups/nginx-citizen-qloapps.conf.bak 2>/dev/null || true
              cp nginx-citizen.conf /etc/nginx/sites-available/citizen.conf
              nginx -t && systemctl reload nginx
              docker stop citizen-lodge || true
              docker update --restart=no citizen-lodge || true
              echo "QloApps stopped; citizen.machera.co.tz now serves Kamra."
            fi

            docker image prune -f

  tune-server:
    if: ${{ inputs.tune_server }}
    runs-on: ubuntu-latest
    steps:
      - name: Add swap and report headroom
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            if ! swapon --show | grep -q /swapfile; then
              fallocate -l 8G /swapfile
              chmod 600 /swapfile
              mkswap /swapfile >/dev/null
              swapon /swapfile
              grep -q '^/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
              echo "8G swap created and persisted"
            else
              echo "swap already present"
            fi
            sysctl -w vm.swappiness=10 >/dev/null
            grep -q '^vm.swappiness' /etc/sysctl.conf || echo 'vm.swappiness=10' >> /etc/sysctl.conf
            echo "=== memory ==="
            free -h
            echo "=== disk ==="
            df -h / | awk 'NR==2{print $4" free of "$2}'
            echo "=== heaviest containers ==="
            docker stats --no-stream --format '{{.Name}}\t{{.MemUsage}}' | sort -k2 -h -r | head -8

  purge-qloapps:
    if: ${{ inputs.purge_qloapps }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify the archive exists on the server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            mkdir -p /root/backups
            # Drop any empty placeholder volumes a previous mistyped run created
            for v in citizen-lodge_qloapps-mysql citizen-lodge_qloapps-www; do
              docker volume rm "$v" 2>/dev/null || true
            done
            # Discover the real QloApps volumes rather than assuming their names
            VOLS=$(docker volume ls -q | grep -E '^citizen-lodge' || true)
            if [ -z "$VOLS" ]; then
              echo "No citizen-lodge volumes on this host - nothing to archive or purge."
              exit 1
            fi
            echo "volumes found:"; echo "$VOLS" | sed 's/^/  /'
            MOUNTS=""
            for v in $VOLS; do MOUNTS="$MOUNTS -v $v:/data/$v:ro"; done
            # File-level archive: no DB credentials needed; captures database,
            # uploaded images and config verbatim.
            docker run --rm $MOUNTS -v /root/backups:/backup \
              alpine tar czf /backup/qloapps-archive.tar.gz -C /data .
            SIZE=$(stat -c%s /root/backups/qloapps-archive.tar.gz)
            echo "archive: /root/backups/qloapps-archive.tar.gz ($SIZE bytes)"
            if [ "$SIZE" -lt 1000000 ]; then
              echo "Archive under 1MB - that cannot be a real QloApps install. Refusing to purge."
              exit 1
            fi
            # sanity: the guest table must be in there
            docker run --rm -v /root/backups:/backup alpine \
              tar tzf /backup/qloapps-archive.tar.gz | grep -q 'mysql/citizenlodge' \
              && echo "verified: citizenlodge database present in archive"

      - name: Fetch the archive off the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: /root/backups/qloapps-archive.tar.gz
          target: ./archive/
          strip_components: 2

      - name: Keep it as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: qloapps-final-archive
          path: ./archive/qloapps-archive.tar.gz
          retention-days: 90
          if-no-files-found: error

      - name: Remove the QloApps stack
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            docker rm -f citizen-lodge 2>/dev/null || true
            for v in $(docker volume ls -q | grep -E '^citizen-lodge' || true); do
              docker volume rm "$v" 2>/dev/null || true
            done
            docker rmi webkul/qloapps_docker:latest 2>/dev/null || true
            docker rmi ghcr.io/cymonmachera/citizen-lodge:latest 2>/dev/null || true
            rm -rf /opt/citizen-lodge
            docker system prune -f
            echo "=== QloApps removed. Disk now: ==="
            df -h / | awk 'NR==2{print $4" free of "$2}'
            free -h | awk 'NR==2{print $7" RAM available"}'
